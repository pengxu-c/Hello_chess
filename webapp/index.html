<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomoku</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!--
    ============================================================
    前端界面 = 内核状态的可视化。
    它只通过两个接口与后端对话：
      GET  /api/events   SSE 推送内核状态快照（只读）
      POST /api/cmd      { op: "...", ... } 发送一条命令（只写）
    它不知道棋盘怎么存、玩家怎么算、有没有存储实现。
    ============================================================
  -->
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Gomoku <span class="brand-tag">microkernel</span></h1>
      <div class="actions">
        <span id="conn" class="badge badge--off">connecting</span>
        <button id="btn-new" class="btn btn--primary">New Game</button>
        <button id="btn-stats" class="btn">Stats</button>
        <button id="btn-theme" class="btn btn--icon" title="Toggle theme (T)">&#9681;</button>
        <button id="btn-quit" class="btn btn--danger">Quit</button>
      </div>
    </header>

    <main class="board-wrap">
      <div class="board-stage">
        <canvas id="board" width="720" height="720"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h2 id="overlay-title">Result</h2>
            <p id="overlay-text"></p>
            <div class="overlay-actions">
              <button id="btn-again" class="btn btn--primary">New Game</button>
              <button id="btn-close" class="btn">Close</button>
            </div>
          </div>
        </div>

        <div id="replay-bar" class="replay-bar hidden">
          <span class="replay-tag">REPLAY</span>
          <button id="rp-first" class="btn btn--icon" title="First">&#8676;</button>
          <button id="rp-prev" class="btn btn--icon" title="Previous">&#8249;</button>
          <button id="rp-play" class="btn btn--icon" title="Play / Pause">&#9654;</button>
          <button id="rp-next" class="btn btn--icon" title="Next">&#8250;</button>
          <button id="rp-last" class="btn btn--icon" title="Last">&#8677;</button>
          <input id="rp-slider" type="range" min="0" max="0" value="0" step="1">
          <span id="rp-count" class="replay-count">0 / 0</span>
          <button id="rp-exit" class="btn">Exit</button>
        </div>
      </div>
    </main>

    <aside class="panel">
      <div class="row"><span class="label">Status</span><span id="meta-status" class="value">-</span></div>
      <div class="row"><span class="label">Turn</span><span id="meta-turn" class="value">-</span></div>
      <div class="row"><span class="label">Moves</span><span id="meta-moves" class="value">0</span></div>
      <div class="row"><span class="label">Board</span><span id="meta-size" class="value">-</span></div>
      <div class="row"><span class="label">Connect</span><span id="meta-connect" class="value">-</span></div>
      <div class="row"><span class="label">Black</span><span id="meta-black" class="value">-</span></div>
      <div class="row"><span class="label">White</span><span id="meta-white" class="value">-</span></div>

      <div class="panel-actions">
        <button id="btn-undo" class="btn" title="Undo (U)">Undo</button>
        <button id="btn-abort" class="btn btn--danger" title="Abort game">Abort</button>
        <button id="btn-save" class="btn" title="Save resume (S)">Save</button>
        <button id="btn-load" class="btn">Resumes</button>
        <button id="btn-games" class="btn" title="Replays (R)">Replays</button>
        <button id="btn-flip" class="btn">Flip</button>
      </div>

      <!-- 局中换人：直接演示"玩家是插件"这件事 -->
      <div class="swap-box">
        <div class="swap-title">Swap player mid-game</div>
        <div class="swap-row">
          <span class="swap-seat">Black</span>
          <select id="swap-black" class="swap-select"></select>
          <button id="btn-swap-black" class="btn btn--small">Set</button>
        </div>
        <div class="swap-row">
          <span class="swap-seat">White</span>
          <select id="swap-white" class="swap-select"></select>
          <button id="btn-swap-white" class="btn btn--small">Set</button>
        </div>
      </div>

      <p id="message" class="hint"></p>
      <p class="hint hint--keys">Keys: N new &middot; U undo &middot; S save &middot; R replays &middot; T theme &middot; Esc close</p>
    </aside>
  </div>

  <!-- 新游戏对话框 -->
  <div id="modal-new" class="modal hidden">
    <div class="modal-card">
      <h2>New Game</h2>
      <label class="field">Board size
        <input id="in-size" type="number" min="4" max="30" value="15">
      </label>
      <label class="field">Win length
        <input id="in-win" type="number" min="4" max="15" value="5">
      </label>
      <label class="field">Black (first)
        <select id="sel-p1"></select>
      </label>
      <label class="field">White (second)
        <select id="sel-p2"></select>
      </label>
      <label class="field field--check">
        <input id="in-storage" type="checkbox" checked> Enable memory storage
      </label>
      <p id="new-note" class="field-note hidden"></p>
      <p id="new-error" class="field-error hidden"></p>
      <div class="modal-actions">
        <button id="btn-start" class="btn btn--primary">Start</button>
        <button id="btn-cancel" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- 列表 / 统计对话框 -->
  <div id="modal-list" class="modal hidden">
    <div class="modal-card modal-card--wide">
      <h2 id="list-title">List</h2>
      <div id="list-body" class="list-body"></div>
      <div class="modal-actions">
        <button id="btn-list-close" class="btn">Close</button>
      </div>
    </div>
  </div>

  <!-- 右下角轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
